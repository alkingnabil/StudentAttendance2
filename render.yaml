services:
  - name: tadreebi-api
    type: web
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SEED_DEMO
        value: "true"

  - name: tadreebi-frontend
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: echo "No build step"
    staticPublishPath: .
    autoDeployTrigger: commit
